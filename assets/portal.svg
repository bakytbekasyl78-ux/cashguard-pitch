<svg xmlns="http://www.w3.org/2000/svg" width="560" height="540" viewBox="0 0 560 540" fill="none" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">Портал к проверяемому результату</title>
<desc id="art-desc">Оригинальный пиксельный портал на парящем светлом каменном острове. Фиолетовое свечение и небольшие бирюзовые кубы продолжают визуальную историю аналитического сервиса.</desc>
