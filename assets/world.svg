<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" fill="none" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">Мир проверяемых событий</title>
<desc id="art-desc">Оригинальная пиксельная сцена: камера наблюдения и банковский сейф на парящем каменном острове рядом со светящимся фиолетовым порталом. Бирюзовые кубы символизируют данные.</desc>
